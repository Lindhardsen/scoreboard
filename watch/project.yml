name: ScoreboardWatch
options:
  bundleIdPrefix: org.lindhardsen.scoreboard
  deploymentTarget:
    watchOS: "11.0"
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: AQ97THYVZU
    CODE_SIGN_STYLE: Automatic
targets:
  # App Store Connect only accepts a watch-only app wrapped in an iOS stub that
  # embeds it (what Xcode's watch-only template generates). Archive this target.
  # Its bundle ID is the one registered in App Store Connect.
  Scoreboard:
    type: application.watchapp2-container
    platform: iOS
    sources: []
    dependencies:
      - target: ScoreboardWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.lindhardsen.scoreboard.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scoreboard
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Scoreboard/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
  ScoreboardWatch:
    type: application
    platform: watchOS
    sources: [ScoreboardWatch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.lindhardsen.scoreboard.watchkitapp.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scoreboard
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ScoreboardWatch/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  ScoreboardWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources: [ScoreboardWatchTests]
    dependencies:
      - target: ScoreboardWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.lindhardsen.scoreboard.watchkitapp.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ScoreboardWatch.app/ScoreboardWatch"
        BUNDLE_LOADER: "$(TEST_HOST)"
  ScoreboardWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources: [ScoreboardWatchUITests]
    dependencies:
      - target: ScoreboardWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.lindhardsen.scoreboard.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ScoreboardWatch
schemes:
  Scoreboard:
    build:
      targets:
        Scoreboard: all
    archive:
      config: Release
  ScoreboardWatch:
    build:
      targets:
        ScoreboardWatch: all
    test:
      targets: [ScoreboardWatchTests]
  ScoreboardWatchUITests:
    build:
      targets:
        ScoreboardWatch: all
        ScoreboardWatchUITests: [test]
    test:
      targets: [ScoreboardWatchUITests]
